name: Publicar en GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publicar-pages
  cancel-in-progress: false
jobs:
  publicar:
    # Solo se publica lo que está en main, también al lanzarlo a mano.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build:pages
      - name: Descargar la rama publicada
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site
      - name: Sustituir el contenido por la compilación nueva
        run: |
          find site -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R dist/. site/
          touch site/.nojekyll
      - name: Confirmar y subir a gh-pages
        working-directory: site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "La compilación no cambia lo publicado."
            exit 0
          fi
          git commit -m "Publica main ${GITHUB_SHA::7}"
          git push origin gh-pages
